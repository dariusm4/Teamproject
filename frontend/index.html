<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7c5cff" />
  <title>PetPal — Pet Care Companion</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root{
      --purple:#7c5cff; --purple-d:#5b3fd6; --pink:#ff7eb6; --peach:#ffb27c;
      --teal:#37d4c4; --amber:#ffb020; --red:#ff5a6e; --green:#27c498;
      --ink:#23203a; --muted:#8a87a3; --line:#eceaf4; --bg:#f5f4fb; --card:#ffffff;
      --side:248px;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;min-height:100%;}
    body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);}

    /* ---------- App shell (web) ---------- */
    .app{display:flex;min-height:100vh;}
    .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--side);background:#fff;border-right:1px solid var(--line);
      display:flex;flex-direction:column;padding:22px 16px;z-index:40;}
    .sidebar .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px;}
    .sidebar .brand .lg{font-size:30px;}
    .sidebar .brand b{font-size:21px;font-weight:900;letter-spacing:-.4px;}
    .side-nav{display:flex;flex-direction:column;gap:4px;}
    .side-nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border:none;background:none;
      border-radius:13px;font-size:14.5px;font-weight:700;color:var(--muted);cursor:pointer;text-align:left;width:100%;}
    .side-nav button .ni{font-size:19px;}
    .side-nav button:hover{background:#f6f4ff;}
    .side-nav button.on{background:linear-gradient(135deg,var(--purple),var(--purple-d));color:#fff;box-shadow:0 8px 18px rgba(124,92,255,.3);}
    .side-user{margin-top:auto;display:flex;align-items:center;gap:11px;padding:12px;border-radius:14px;background:#f6f4ff;}
    .side-user .ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--pink));
      color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;}
    .side-user .nm{font-weight:700;font-size:13.5px;}
    .side-user .em{font-size:11px;color:var(--muted);}
    .side-logout{margin-top:10px;width:100%;}

    .main{flex:1;margin-left:var(--side);min-width:0;}
    .container{max-width:1080px;margin:0 auto;padding:0 26px 60px;}

    /* page hero */
    .head{padding:26px 30px;color:#fff;border-radius:0 0 26px 26px;margin:0 -26px 0;
      background:linear-gradient(120deg,var(--purple),var(--pink));}
    .head.alt{background:linear-gradient(120deg,var(--teal),var(--purple));}
    .head h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.4px;}
    .head .sub{opacity:.92;font-size:13.5px;margin-top:4px;}
    .head-row{display:flex;justify-content:space-between;align-items:center;}
    .avatar-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.25);
      display:flex;align-items:center;justify-content:center;font-size:20px;border:none;color:#fff;cursor:pointer;}

    /* cards */
    .card{background:var(--card);border-radius:20px;padding:20px;margin-top:18px;
      box-shadow:0 6px 22px rgba(80,60,140,.06);}
    .card h3{margin:0 0 12px;font-size:17px;}
    .row{display:flex;gap:12px;}
    .row>*{flex:1;}
    .grid2{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
    .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
    .detail-grid{display:grid;grid-template-columns:1fr;gap:0;}

    /* stat tiles */
    .stat{border-radius:18px;padding:18px;color:#fff;}
    .stat .num{font-size:30px;font-weight:800;line-height:1;}
    .stat .lbl{font-size:12.5px;opacity:.92;margin-top:7px;}
    .bg-p{background:linear-gradient(135deg,#7c5cff,#a98bff);}
    .bg-t{background:linear-gradient(135deg,#37d4c4,#5fe0d2);}
    .bg-a{background:linear-gradient(135deg,#ffb020,#ffcf5f);}
    .bg-r{background:linear-gradient(135deg,#ff5a6e,#ff8a9a);}

    /* horizontal pet chips */
    .pets-scroll{display:flex;gap:14px;overflow-x:auto;padding:2px 0 8px;flex-wrap:wrap;}
    .petchip{flex:0 0 auto;width:130px;border-radius:18px;padding:16px;text-align:center;cursor:pointer;
      background:linear-gradient(160deg,#fff,#f3f0ff);border:1.5px solid var(--line);transition:.15s;}
    .petchip:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(124,92,255,.18);}
    .petchip.active{border-color:var(--purple);box-shadow:0 6px 16px rgba(124,92,255,.25);}
    .petchip .emo{font-size:40px;}
    .petchip .nm{font-weight:700;font-size:15px;margin-top:8px;}
    .petchip .br{font-size:11.5px;color:var(--muted);}

    /* list rows */
    .item{display:flex;align-items:center;gap:13px;padding:13px 0;border-top:1px solid var(--line);}
    .item:first-of-type{border-top:none;}
    .item .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;
      font-size:20px;background:#f3f0ff;flex:0 0 auto;}
    .item .tt{font-weight:600;font-size:14.5px;}
    .item .ss{font-size:12.5px;color:var(--muted);margin-top:2px;}
    .item .right{margin-left:auto;text-align:right;}
    .pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block;}
    .pill.soon{background:#fff3df;color:#b9760a;}
    .pill.overdue{background:#ffe3e7;color:#d33;}
    .pill.ok{background:#e4f8f1;color:#1c9e74;}
    .x{background:none;border:none;color:#c7c3d8;font-size:20px;cursor:pointer;padding:0 4px;}
    .x:hover{color:var(--red);}

    /* notifications */
    .notif{display:flex;gap:11px;align-items:center;padding:13px 16px;border-radius:15px;margin-top:10px;font-size:13.5px;font-weight:600;}
    .notif.soon{background:#fff5e6;border-left:4px solid var(--amber);}
    .notif.overdue{background:#ffecef;border-left:4px solid var(--red);}
    .notif .em{font-size:20px;}

    /* forms */
    label{display:block;font-size:12.5px;font-weight:700;margin:12px 0 5px;color:#564f72;}
    input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:13px;
      font-size:14px;background:#faf9ff;font-family:inherit;}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple);background:#fff;}
    .emoji-pick{display:flex;gap:8px;flex-wrap:wrap;}
    .emoji-pick button{width:48px;height:48px;border-radius:13px;border:1.5px solid var(--line);background:#faf9ff;
      font-size:23px;cursor:pointer;}
    .emoji-pick button.on{border-color:var(--purple);background:#f0ebff;}

    .btn{width:100%;background:linear-gradient(135deg,var(--purple),var(--purple-d));color:#fff;border:none;
      padding:14px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 8px 20px rgba(124,92,255,.3);}
    .btn:active{transform:translateY(1px);}
    .btn.sec{background:#f0ecff;color:var(--purple);box-shadow:none;}
    .btn.ghost{background:none;color:var(--purple);box-shadow:none;border:1.5px solid #e2dbff;}
    .chip-tabs{display:flex;gap:8px;margin:4px 0 2px;overflow-x:auto;flex-wrap:wrap;}
    .chip-tabs button{flex:0 0 auto;padding:9px 17px;border-radius:20px;border:1.5px solid var(--line);
      background:#fff;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;}
    .chip-tabs button.on{background:var(--purple);color:#fff;border-color:var(--purple);}
    .muted{color:var(--muted);font-size:13px;}
    .empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px;}
    .empty .be{font-size:46px;display:block;margin-bottom:10px;}

    /* FAB */
    .fab{position:fixed;right:34px;bottom:34px;width:60px;height:60px;border-radius:50%;
      background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-size:31px;border:none;
      box-shadow:0 12px 26px rgba(124,92,255,.45);cursor:pointer;z-index:35;}

    /* modal (centered on web) */
    .sheet-bg{position:fixed;inset:0;background:rgba(30,20,60,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;}
    .sheet{background:#fff;width:100%;max-width:520px;border-radius:22px;padding:14px 26px 28px;max-height:90vh;overflow-y:auto;
      animation:pop .2s ease;box-shadow:0 30px 80px rgba(40,20,90,.4);}
    @keyframes pop{from{transform:scale(.96);opacity:.6;}to{transform:scale(1);opacity:1;}}
    .grab{display:none;}
    .sheet h2{margin:6px 0 10px;font-size:21px;}

    /* mobile bottom nav (hidden on desktop) */
    .nav{display:none;}

    /* Auth */
    .auth-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;
      background:linear-gradient(140deg,#7c5cff,#ff7eb6);}
    .auth-card{background:#fff;border-radius:26px;padding:30px 28px;width:100%;max-width:400px;}
    .logo{text-align:center;color:#fff;margin-bottom:26px;}
    .logo .big{font-size:62px;}
    .logo h1{margin:8px 0 2px;font-size:34px;font-weight:900;letter-spacing:-.5px;}
    .logo p{margin:0;opacity:.92;font-size:14.5px;}
    .err{color:var(--red);font-size:13px;margin-top:10px;font-weight:600;text-align:center;}
    .seg{display:flex;background:#f0ecff;border-radius:13px;padding:4px;margin-bottom:6px;}
    .seg button{flex:1;border:none;background:none;padding:11px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer;}
    .seg button.on{background:#fff;color:var(--purple);box-shadow:0 2px 8px rgba(124,92,255,.18);}

    /* ---------- Responsive: tablet ---------- */
    @media(max-width:900px){
      .grid2{grid-template-columns:repeat(2,1fr);}
    }
    /* ---------- Responsive: mobile ---------- */
    @media(max-width:680px){
      .sidebar{display:none;}
      .main{margin-left:0;padding-bottom:80px;}
      .container{padding:0 16px 40px;}
      .head{padding:22px 18px;margin:0 -16px 0;border-radius:0 0 22px 22px;}
      .head h1{font-size:23px;}
      .grid2{grid-template-columns:repeat(2,1fr);gap:12px;}
      .fab{right:18px;bottom:90px;}
      .sheet-bg{align-items:flex-end;padding:0;}
      .sheet{max-width:100%;border-radius:24px 24px 0 0;}
      .grab{display:block;width:42px;height:5px;background:#e3dff2;border-radius:3px;margin:6px auto 12px;}
      .nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:72px;background:rgba(255,255,255,.96);
        backdrop-filter:blur(10px);border-top:1px solid var(--line);justify-content:space-around;align-items:center;z-index:40;}
      .nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
        font-size:10.5px;color:var(--muted);cursor:pointer;font-weight:700;flex:1;}
      .nav button .ni{font-size:22px;filter:grayscale(1);opacity:.55;}
      .nav button.on{color:var(--purple);}
      .nav button.on .ni{filter:none;opacity:1;}
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="app.js" data-presets="react"></script>
</body>
</html>
